name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Windows AMD64
        run: wails build --platform windows/amd64 --clean

      - name: List build output
        shell: bash
        run: find build/bin -type f -name "*.exe" -o -name "*.app" 2>/dev/null

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $env:PATH = "${env:PATH};C:\Program Files (x86)\Inno Setup 6"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" "/DMyAppFilename=Predator.exe" "build\windows\installer\installer.iss"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            build/bin/Predator.exe
            build/bin/Predator-*-windows-setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build macOS
        run: wails build --platform darwin/arm64 --clean

      - name: Find built app bundle
        id: find_app
        run: |
          APP_BUNDLE=$(ls -d build/bin/*.app 2>/dev/null | head -1)
          echo "app_bundle=$APP_BUNDLE" >> $GITHUB_OUTPUT
          echo "Found app bundle: $APP_BUNDLE"

      - name: Create DMG
        run: |
          brew install create-dmg

          APP_BUNDLE="${{ steps.find_app.outputs.app_bundle }}"
          if [ -z "$APP_BUNDLE" ]; then
            echo "No .app bundle found in build/bin/"
            ls -la build/bin/ 2>/dev/null || echo "build/bin/ does not exist"
            exit 1
          fi

          mkdir -p Predator-dmg/Staging
          cp -R "$APP_BUNDLE" Predator-dmg/Staging/

          create-dmg \
            --volname "Predator ${{ steps.version.outputs.VERSION }}" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$(basename "$APP_BUNDLE")" 200 190 \
            --hide-extension "$(basename "$APP_BUNDLE")" \
            --app-drop-link 600 190 \
            "build/bin/Predator-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg" \
            "Predator-dmg/Staging/"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            build/bin/Predator-*-macos-arm64.dmg

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Linux AMD64
        run: wails build --platform linux/amd64 --clean

      - name: List build output
        run: find build/bin -type f -name "Predator*" 2>/dev/null

      - name: Create tarball
        run: |
          cd build/bin
          tar -czf Predator-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz Predator

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: build/bin/Predator-*-linux-amd64.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: find . -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Predator v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            windows-amd64/**
            macos-arm64/**
            linux-amd64/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
